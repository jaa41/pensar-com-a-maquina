<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel pré-audiência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#EEF0EF;      /* fundo ardósia claro */
  --folha:#FFFFFF;
  --tinta:#1E2A38;      /* texto */
  --grafite:#5B6570;    /* texto secundário */
  --linha:#D3D8DB;
  --autor:#1F6F78;      /* reclamante */
  --autor-suave:#E1EFF0;
  --reu:#7A2E3B;        /* reclamado */
  --reu-suave:#F3E4E7;
  --misto:#4F5D75;      /* ônus repartido ou dinâmico */
  --misto-suave:#E4E7EE;
  --alerta:#B5761B;
  --alerta-suave:#F7ECD9;
  --ok:#3E7A4F;
  --ok-suave:#E3EFE5;
  --raio:6px;
  --fonte:"Literata",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--fonte);font-size:16px;line-height:1.55}
body.grande{font-size:19px}
a{color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--autor);outline-offset:2px}

/* Cabeçalho fixo */
.topo{position:sticky;top:0;z-index:5;background:var(--folha);border-bottom:1px solid var(--linha);padding:10px 16px 0}
.topo .linha1{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-right:230px}
.processo{font-weight:700;font-size:1.05em;letter-spacing:.01em}
.audiencia{color:var(--grafite);font-size:.9em}
.gerado{color:var(--grafite);font-size:.78em;width:100%}
.partes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;font-size:.92em}
.partes .autor{border-left:4px solid var(--autor);padding-left:8px}
.partes .reu{border-right:4px solid var(--reu);padding-right:8px;text-align:right}
.partes small{display:block;color:var(--grafite);font-size:.82em}
.partes .lista{display:block}
.partes .lista em{font-style:normal;color:var(--grafite);font-size:.85em}
.partes .nome-real{font-weight:600}
.partes .parte-item{display:block;margin-bottom:4px}
.partes .parte-item:last-child{margin-bottom:0}
.partes .rep{display:block;color:var(--grafite);font-size:.84em;font-weight:normal;margin-top:1px;line-height:1.25}
/* Muitas partes de um lado: o cabeçalho fixo mostra as duas primeiras e recolhe o resto. */
.partes .lista.recolhida .parte-item:nth-child(n+3){display:none}
.partes .lista.aberta{max-height:40vh;overflow-y:auto}
.partes .mais{background:none;border:0;padding:0;margin-top:2px;color:var(--grafite);font:inherit;font-size:.84em;text-decoration:underline;cursor:pointer}
@media print{.partes .lista.recolhida .parte-item{display:block!important}.partes .lista.aberta{max-height:none;overflow:visible}.partes .mais{display:none}}
.abas{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{white-space:nowrap;padding:8px 12px;border-bottom:3px solid transparent;color:var(--grafite)}
.aba[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--tinta);font-weight:500}
.aba .n{display:inline-block;min-width:1.4em;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--papel);font-size:.78em;text-align:center;color:var(--grafite)}
.acoes{position:absolute;right:16px;top:10px;display:flex;gap:6px}
.acoes button{font-size:.8em;color:var(--grafite);border:1px solid var(--linha);border-radius:var(--raio);padding:3px 8px;background:var(--folha)}
.status-exp{font-size:.78em;color:var(--grafite);max-width:32ch}
.status-exp.ok{color:var(--ok)}
.status-exp.erro{color:var(--alerta)}

main{max-width:900px;margin:0 auto;padding:18px 16px 60px}
section[hidden]{display:none}
h2{font-size:1.15em;font-weight:700;margin:0 0 10px}
h3{font-size:1em;font-weight:500;color:var(--grafite);margin:20px 0 8px}
p{margin:0 0 10px;max-width:70ch}

/* Caso */
.resumo{background:var(--folha);border:1px solid var(--linha);border-radius:var(--raio);padding:14px 16px;font-size:1.02em}
.contrato{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;margin-top:14px}
.contrato div{background:var(--folha);padding:8px 12px}
.contrato small{display:block;color:var(--grafite);font-size:.8em}
.incontro{list-style:none;padding:0;margin:0}
.incontro li{padding:8px 12px;border-left:3px solid var(--ok);background:var(--ok-suave);margin-bottom:6px;border-radius:0 var(--raio) var(--raio) 0}
.incontro li span{color:var(--grafite);font-size:.88em}
.alertas li{padding:8px 12px;border-left:3px solid var(--alerta);background:var(--alerta-suave);margin-bottom:6px;list-style:none;border-radius:0 var(--raio) var(--raio) 0}
ul.alertas{padding:0}

/* Controvérsias: o ponto central do design */
.contro{background:var(--folha);border:1px solid var(--linha);border-radius:var(--raio);margin-bottom:14px;overflow:hidden}
.contro header{padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--linha)}
.contro header b{font-size:1.05em}
.contro header b i{font-style:normal;color:var(--grafite);font-weight:400;margin-right:6px}
.contro header span{color:var(--grafite);font-size:.85em;white-space:nowrap}
.versoes{display:grid;grid-template-columns:1fr 1fr}
.versoes>div{padding:10px 14px;font-size:.95em}
.versoes .v-autor{border-left:4px solid var(--autor)}
.versoes .v-reu{border-right:4px solid var(--reu);text-align:right}
.versoes small{display:block;color:var(--grafite);font-size:.8em;margin-bottom:2px}
.versoes .defesa+.defesa{margin-top:8px;padding-top:8px;border-top:1px dashed var(--linha)}
.onus{position:relative;min-height:34px;border-top:1px solid var(--linha);background:linear-gradient(90deg,var(--autor-suave),var(--folha) 50%,var(--reu-suave));display:flex;align-items:center}
.onus .marca{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:.85em;font-weight:500;color:#fff;flex:none}
.onus .marca.autor{background:var(--autor);border-radius:0 17px 17px 0;order:0}
.onus .marca.reu{background:var(--reu);border-radius:17px 0 0 17px;order:2;margin-left:auto}
.onus .marca.misto{background:var(--misto);border-radius:17px;order:1;margin:0 auto}
.onus .fund{flex:1;padding:4px 12px;font-size:.8em;color:var(--grafite);order:1}
.onus .marca.reu~.fund{order:0}
.onus.repartido{background:var(--misto-suave)}
.contro footer{padding:8px 14px;font-size:.88em;color:var(--grafite)}
@media (max-width:520px){
  .versoes{grid-template-columns:1fr}
  .versoes .v-reu{border-right:0;border-left:4px solid var(--reu);text-align:left}
}

/* Provas */
table{width:100%;border-collapse:collapse;background:var(--folha);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;font-size:.93em}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--linha);vertical-align:top}
th{font-weight:500;color:var(--grafite);font-size:.85em}
td.num{color:var(--grafite);white-space:nowrap}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.82em;white-space:nowrap}
.pill.completa{background:var(--ok-suave);color:var(--ok)}
.pill.parcial{background:var(--alerta-suave);color:var(--alerta)}
.pill.pendente{background:var(--reu-suave);color:var(--reu)}
.pill.dispensada{background:var(--papel);color:var(--grafite)}
.parte.autor{color:var(--autor);font-weight:500}
.parte.reu{color:var(--reu);font-weight:500}
.parte.misto{color:var(--misto);font-weight:500}
.tabela-rolagem{overflow-x:auto}
.legenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.85em;color:var(--grafite)}

/* Roteiro */
.depoentes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.depoente{padding:6px 12px;border:1px solid var(--linha);border-radius:99px;background:var(--folha);font-size:.92em}
.depoente[aria-selected="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.depoente.autor[aria-selected="true"]{background:var(--autor);border-color:var(--autor)}
.depoente.reu[aria-selected="true"]{background:var(--reu);border-color:var(--reu)}
.depoente.mais{border-style:dashed;color:var(--grafite)}
.progresso{font-size:.88em;color:var(--grafite);margin-bottom:10px}
.pergunta{background:var(--folha);border:1px solid var(--linha);border-radius:var(--raio);margin-bottom:8px}
.pergunta label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
.pergunta input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--tinta);flex:none}
.pergunta .txt{flex:1}
.pergunta .tema{display:block;color:var(--grafite);font-size:.8em;margin-bottom:2px}
.pergunta.feita .txt{color:var(--grafite);text-decoration:line-through;text-decoration-color:var(--linha)}
.pergunta textarea{width:100%;border:0;border-top:1px dashed var(--linha);padding:8px 14px 10px 48px;font-family:inherit;font-size:.92em;background:transparent;resize:vertical;min-height:38px;color:var(--tinta)}
.pergunta textarea::placeholder{color:#A9B0B6}
.livre{margin-top:14px}
.livre textarea{width:100%;min-height:80px;border:1px solid var(--linha);border-radius:var(--raio);padding:10px 12px;font-family:inherit;font-size:.95em;background:var(--folha);color:var(--tinta)}
/* cabeca do depoimento: dispensa (parte) e nome (testemunha) */
.cabeca-dep{background:var(--folha);border:1px solid var(--linha);border-radius:var(--raio);padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cabeca-dep .rot{font-weight:600}
.cabeca-dep small{color:var(--grafite);font-size:.82em;flex-basis:100%;margin-top:2px}
.cabeca-dep input[type=text]{flex:1;min-width:240px;border:1px solid var(--linha);border-radius:var(--raio);padding:8px 10px;font-family:inherit;font-size:.95em;background:#fff;color:var(--tinta)}
.cabeca-dep label.disp{display:flex;gap:10px;align-items:center;cursor:pointer}
.cabeca-dep input[type=checkbox]{width:22px;height:22px;accent-color:var(--tinta);flex:none}
.lista-perg.fora .pergunta,.lista-perg.fora .livre{opacity:.42}
.depoente.vazio{border-style:dashed}
.depoente.vazio:not([aria-selected="true"]){color:var(--grafite)}

/* Perícia em destaque (ADR 0094): laudo, conclusão do perito e o pedido exato de honorários */
.pericia{background:var(--folha);border:1px solid var(--linha);border-left:4px solid var(--toga,#14508c);border-radius:var(--raio);padding:12px 16px;margin-bottom:10px}
.pericia header{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:6px}
.pericia header span{color:var(--grafite);font-size:.85em}
.pericia div{margin-top:8px}
.pericia small{display:block;color:var(--grafite);font-size:.8em;margin-bottom:2px}
.pericia .honorarios{background:var(--alerta-suave);border-radius:var(--raio);padding:8px 10px;font-weight:600}
.pericia .honorarios small{font-weight:400}
.pericia .ref{margin-top:8px}
/* Requerimento a anunciar na abertura (0.111.0): em Alertas, na aba Caso, e nas Preliminares.
   PEDE e DECISÃO ficam apartados; só a DECISÃO vai para a área de transferência. */
.alertas li.anunciar{padding:0}
.anunciar .cab{display:flex;gap:10px;align-items:flex-start;padding:8px 12px}
.anunciar .cab input{width:20px;height:20px;accent-color:var(--tinta);flex:none;margin-top:2px}
.anunciar .cab button{flex:1;text-align:left;border:0;background:none;padding:0;font:inherit;font-weight:600;color:inherit;cursor:pointer}
.anunciar .cab button::after{content:"  ▾ pedido e decisão";color:var(--grafite);font-size:.85em;font-weight:400}
.anunciar.aberto .cab button::after{content:"  ▴ fechar"}
.anunciar.feito .cab button{text-decoration:line-through;font-weight:400;color:var(--grafite)}
.anunciar .corpo{padding:0 12px 10px}
.anunciar .elo{border:0;background:none;padding:0;margin-top:6px;font:inherit;font-size:.85em;color:var(--grafite);text-decoration:underline;cursor:pointer}
.req{margin:0 14px 12px;display:grid;gap:8px}
.anunciar .req{margin:0}
.req>div{background:var(--folha);border:1px solid var(--linha);border-radius:var(--raio);padding:9px 12px}
.req small{display:block;color:var(--grafite);font-size:.78em;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.req .decisao{border-left:4px solid var(--tinta)}
.req ol{margin:4px 0 0;padding-left:22px}
.req .acoes-req{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}
.req .acoes-req button{padding:5px 12px;border:1px solid var(--tinta);border-radius:99px;background:var(--tinta);color:#fff;font:inherit;font-size:.88em;cursor:pointer}
.req .acoes-req label{display:flex;gap:6px;align-items:center;font-size:.88em;cursor:pointer}
.req .acoes-req .copiado{font-size:.85em;color:var(--grafite)}
.req textarea[data-dec-edit]{display:block;width:100%;box-sizing:border-box;border:1px dashed var(--linha);border-radius:var(--raio);padding:8px 10px;font:inherit;color:inherit;background:transparent;resize:vertical;field-sizing:content;min-height:5em}
.req textarea[data-dec-edit]:focus{border-style:solid;border-color:var(--tinta);outline:0}
.req .acoes-req .restaurar{background:none;color:var(--grafite);border-color:var(--linha)}
.req .editada{font-size:.85em;color:var(--grafite)}
/* Estimativa de condenação e conciliação (0.111.0): o quadro do registro de provas, na aba Caso */
.conc table{width:100%;border-collapse:collapse}
.conc td{padding:5px 0;border-bottom:1px solid var(--linha);vertical-align:top}
.conc td:last-child{text-align:right;font-variant-numeric:tabular-nums;padding-left:16px;white-space:nowrap}
.conc tr.total td{font-weight:700;border-bottom:0}
.conc td.longo{white-space:normal}
.atalho{margin:10px 0 0}
.atalho a{display:inline-block;padding:6px 14px;border:1px solid var(--tinta);border-radius:99px;text-decoration:none;font-size:.92em}
.atalho-resumo{margin:0 0 12px}
.resumo.alvo{outline:2px solid var(--alerta);outline-offset:2px}
.req .acoes-req label.inverter{font-weight:600}
li.invertido>.cab button,li.invertido>label>span{color:var(--reu)}
.check li.alvo{outline:2px solid var(--alerta);outline-offset:2px;border-radius:var(--raio)}

/* Ata: o texto copiado do PJe, gravado na pasta do processo (ADR 0091) */
.explica{color:var(--grafite);font-size:.92em;margin:4px 0 12px}
.ata textarea{width:100%;min-height:60vh;border:1px solid var(--linha);border-radius:var(--raio);padding:12px 14px;font-family:inherit;font-size:.95em;line-height:1.5;background:var(--folha);color:var(--tinta);resize:vertical}
.acoes-ata{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.acoes-ata button{color:var(--grafite);border:1px solid var(--linha);border-radius:var(--raio);padding:6px 12px;background:var(--folha)}
.acoes-ata small{color:var(--grafite);font-size:.8em}
.aba .n.ok{background:var(--ok);color:#fff}

/* Pré-sentença (ADR 0114): o rascunho da sentença tópico a tópico — o que está em redação final,
   o que a audiência fecha (lacuna, com os ramos) e o campo de observação de cada um */
.acoes-ps{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:.88em;color:var(--grafite)}
.acoes-ps button,.acoes-ps a{border:1px solid var(--linha);border-radius:var(--raio);padding:4px 10px;background:var(--folha);text-decoration:none;color:var(--grafite)}
.acoes-ps label{display:flex;gap:6px;align-items:center;cursor:pointer}
.indice-ps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.indice-ps button{padding:3px 10px;border:1px solid var(--linha);border-left:4px solid var(--ok);border-radius:var(--raio);background:var(--folha);font-size:.85em}
.indice-ps button.lacuna{border-left-color:var(--alerta);font-weight:500}
.indice-ps button.anotado::after{content:" ✎"}
.cap-ps{font-weight:700;color:var(--tinta);margin-top:24px}
.sec-ps{background:var(--folha);border:1px solid var(--linha);border-left:4px solid var(--ok);border-radius:var(--raio);margin-bottom:10px}
.sec-ps.lacuna{border-left-color:var(--alerta)}
.sec-ps summary{display:flex;gap:10px;align-items:baseline;padding:10px 14px;cursor:pointer;list-style:none}
.sec-ps summary::-webkit-details-marker{display:none}
.sec-ps summary::before{content:"▸";color:var(--grafite);flex:none}
.sec-ps[open] summary::before{content:"▾"}
.sec-ps summary b{flex:1}
.sec-ps .tem-obs{color:var(--grafite);font-size:.82em;white-space:nowrap}
.sec-ps.alvo{outline:2px solid var(--alerta);outline-offset:2px}
.texto-ps{padding:2px 16px 4px}
.texto-ps p{max-width:none;text-align:justify;hyphens:auto}
.texto-ps .tabela-rolagem{margin:0 0 10px}
.lac-ps{border:1px solid var(--alerta);border-radius:var(--raio);background:var(--alerta-suave);margin:12px 0;padding:10px 12px}
.lac-ps>header{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}
.lac-ps>header span{color:var(--grafite);font-size:.85em;white-space:nowrap}
.lac-ps .ramo,.lac-ps .aval,.lac-ps .externa{background:var(--folha);border:1px solid var(--linha);border-radius:var(--raio);padding:8px 12px;margin-top:8px}
.lac-ps .ramo>label{display:flex;gap:10px;align-items:flex-start;font-weight:600;cursor:pointer;margin-bottom:6px}
.lac-ps .ramo>label input{width:20px;height:20px;accent-color:var(--ok);flex:none;margin-top:2px}
.lac-ps .ramo.adotado{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.lac-ps small{display:block;color:var(--grafite);font-size:.78em;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.obs-ps{padding:0 14px 12px}
.obs-ps textarea,.lac-ps .aval textarea{display:block;width:100%;border:1px dashed var(--linha);border-radius:var(--raio);padding:8px 10px;font:inherit;font-size:.95em;color:inherit;background:transparent;resize:vertical;field-sizing:content;min-height:3.2em}
.obs-ps textarea:focus,.lac-ps .aval textarea:focus{border-style:solid;border-color:var(--tinta);outline:0}
#s-presentenca.so-lacunas .sec-ps.pronto,#s-presentenca.so-lacunas .cap-ps,#s-presentenca.so-lacunas .indice-ps button.pronto{display:none}

/* Verificar */
.check{list-style:none;padding:0}
.check li{background:var(--folha);border:1px solid var(--linha);border-radius:var(--raio);margin-bottom:8px}
.check label{display:flex;gap:12px;padding:11px 14px;cursor:pointer;align-items:flex-start}
.check input{width:22px;height:22px;accent-color:var(--tinta);flex:none;margin-top:2px}
.check small{display:block;color:var(--grafite);font-size:.85em}

/* Autos: atalhos para o dossiê e para as peças */
.links{list-style:none;padding:0;margin:0}
.links li{background:var(--folha);border:1px solid var(--linha);border-radius:var(--raio);margin-bottom:6px;padding:9px 14px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.links a{text-decoration:none;font-weight:500}
.links a:hover{text-decoration:underline}
.links small{color:var(--grafite);font-size:.8em;white-space:nowrap}
.links code{font-family:Consolas,monospace;font-size:.85em;color:var(--grafite);margin-right:6px}

.links.essenciais li{border-left:3px solid var(--toga,#14508c)}
.rodape{margin-top:30px;color:var(--grafite);font-size:.8em;text-align:center}
@media print{
  .topo{position:static}.abas,.acoes,.acoes-ata,.depoente.mais,.nome-real{display:none}
  .topo .linha1{padding-right:0}
  section[hidden]{display:block}section{break-before:page}section:first-of-type{break-before:auto}
  #s-presentenca{display:none!important}
  .lista-perg[hidden]{display:block}
  .lista-perg.fora{display:none}
  .lista-perg::before{content:attr(data-nome);display:block;font-weight:700;margin:14px 0 8px}
  textarea{border:1px solid var(--linha)!important}
}
/* Abertura (ADR 0141): o que o juiz precisa saber antes de começar, respondido pela IA com a peça */
.abertura{border:1px solid var(--linha);border-radius:var(--raio);background:var(--folha);overflow:hidden;margin-bottom:6px}
.abertura .ab-item{display:grid;grid-template-columns:minmax(150px,30%) 1fr;gap:4px 14px;padding:9px 14px;border-bottom:1px solid var(--linha);border-left:4px solid transparent}
.abertura .ab-item:last-child{border-bottom:0}
.abertura .ab-item.atencao{border-left-color:var(--alerta)}
.abertura .ab-item.providencia{border-left-color:var(--reu);background:var(--alerta-suave)}
.abertura .ab-tema{font-weight:600;font-size:.92em}
.abertura .ab-sit{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;font-size:.78em;font-weight:500;white-space:nowrap;color:#fff;background:var(--grafite)}
.abertura .ab-sit.ok{background:var(--ok)}
.abertura .ab-sit.atencao{background:var(--alerta)}
.abertura .ab-sit.providencia{background:var(--reu)}
.abertura .ab-pecas{margin-top:4px;font-size:.85em}
.abertura .ab-pecas a{margin-right:12px}
.ab-indice{font-size:.85em;color:var(--grafite);padding:8px 14px;border:1px dashed var(--linha);border-radius:var(--raio);margin-bottom:14px}
.ab-indice small{display:block;margin-bottom:2px}
.ab-indice a{margin-right:10px}
@media (max-width:640px){.abertura .ab-item{grid-template-columns:1fr}}
/* PARADA de integridade (ADR 0164): sem pré-sentença, o painel sai mais simples, com o motivo no topo */
.parada{border:2px solid var(--reu);border-radius:var(--raio);background:var(--alerta-suave);padding:12px 16px;margin-bottom:16px}
.parada h3{margin:0 0 6px;color:var(--reu)}
.parada p{margin:0 0 8px}
.parada ol{margin:6px 0 4px;padding-left:22px}
.parada ol li{margin-bottom:4px}
.parada .ab-pecas{font-size:.85em}
.parada .ab-pecas a{margin-right:12px}
.avisos li{padding:6px 12px;border-left:3px solid var(--grafite);background:var(--papel);margin-bottom:4px;list-style:none;border-radius:0 var(--raio) var(--raio) 0;font-size:.88em;color:var(--grafite)}
ul.avisos{padding:0}
</style>

const $ = s=>document.querySelector(s);
/* Requerimento a anunciar na abertura: a análise da preliminar vem como "PEDE: … DECISÃO: …".
   As duas partes ficam apartadas na tela, e só a DECISÃO (texto pronto para a ata) é copiada.
   "COLA:" é o nome antigo de DECISÃO e continua lido. */
function partesPrel(a){
  const m = /^\s*PEDEM?:\s*([\s\S]*?)\s*(?:DECISÃO|DECISAO|COLA):\s*([\s\S]*)$/.exec(a||"");
  return m ? {pede:m[1], decisao:m[2].trim()} : null;
}
function decisaoHtml(d){
  const p = d.split(/\s*\((\d{1,2})\)\s*/);          // "…, porque: (1) a; (2) b." -> abertura + fundamentos
  if(p.length < 5) return d;
  const itens = []; for(let k=2;k<p.length;k+=2) itens.push(p[k]);
  return `${p[0]}<ol>${itens.map(x=>`<li>${x}</li>`).join("")}</ol>`;
}
function blocoPrel(a,i,editavel){
  const x = partesPrel(a); if(!x) return "";
  // Nas Preliminares o juiz reescreve a decisão do seu jeito; o que ele escrever é o que se copia,
  // o que Alertas mostra e o que vai às anotações. O texto fica no navegador, com as demais anotações.
  const corpo = editavel
    ? `<textarea data-dec-edit="${i}" rows="${Math.ceil(x.decisao.length/95)+1}" spellcheck="true" title="Edite à vontade: é este o texto copiado">${x.decisao}</textarea>`
    : `<div data-dec-ver="${i}">${decisaoHtml(x.decisao)}</div>`;
  return `<div class="req"><div class="pede"><small>Pede</small>${x.pede}</div>
    <div class="decisao"><small>Decisão — texto para a ata${editavel?" (editável)":""}</small>${corpo}
      <div class="acoes-req"><button type="button" data-copiar-dec="${i}">Copiar decisão</button>
        <label><input type="checkbox" data-protesto="${i}"> protesto registrado</label>
        <label class="inverter"><input type="checkbox" data-inverter="${i}"> ${sentidoPrel(i)==="INDEFERIR"?"deferir":"indeferir"} (ao contrário da pré-sentença)</label>
        ${editavel?`<button type="button" class="restaurar" data-restaurar-dec="${i}" hidden>Restaurar o texto original</button>`:`<span class="editada" data-dec-editada="${i}" hidden>editada por você</span>`}
        <span class="copiado" hidden>copiado</span></div></div></div>`;
}
/* O juiz pode decidir na sala ao contrário do que a pré-sentença previa. O rótulo acompanha, a
   decisão ganha um começo para ele completar, e a exportação avisa — a sentença precisa saber. */
function sentidoPrel(i){ return /\bDEFERIR\b/.test((DADOS.preliminares[i]||[""])[0]) && !/INDEFERIR/.test(DADOS.preliminares[i][0]) ? "DEFERIR" : "INDEFERIR"; }
function invertido(i){ return !!document.querySelector(`[data-inverter="${i}"]:checked`); }
function rotuloPrel(i){
  const p = (DADOS.preliminares[i]||[""])[0]; if(!invertido(i)) return p;
  const novo = sentidoPrel(i)==="INDEFERIR" ? "DEFERIR" : "INDEFERIR";
  return /INDEFERIR|DEFERIR/.test(p) ? p.replace(/INDEFERIR|DEFERIR/, novo) : p + " — " + novo;
}
function partidaContraria(i){
  const p = (DADOS.preliminares[i]||[""])[0].split(" — ")[0];
  return (sentidoPrel(i)==="INDEFERIR" ? "Defiro" : "Indefiro") + " o requerimento (" + p + "), porque: ";
}
function aoInverter(i){
  const ta = document.querySelector(`[data-dec-edit="${i}"]`);
  if(ta){   // só troca o texto que o juiz ainda não escreveu: o original ou o começo da contrária
    const v = ta.value.trim();
    if(invertido(i) && v === decisaoOriginal(i)) ta.value = partidaContraria(i);
    else if(!invertido(i) && v === partidaContraria(i).trim()) ta.value = decisaoOriginal(i);
  }
  pintarDecisao(i);
}
function pintarRotulos(){
  document.querySelectorAll("[data-rot]").forEach(el=>{ const i=el.dataset.rot; el.textContent = rotuloPrel(i);
    el.closest("li").classList.toggle("invertido", invertido(i)); });
}
const PROTESTO = "Registrado o protesto da parte requerente.", PROTESTO_CONTRA = "Registrado o protesto da parte contrária.";
function decisaoOriginal(i){ const x = partesPrel((DADOS.preliminares[i]||[])[1]); return x ? x.decisao : ""; }
function decisaoAtual(i){
  const ta = document.querySelector(`[data-dec-edit="${i}"]`);
  return (ta && ta.value.trim()) || decisaoOriginal(i);
}
function textoDecisao(i){
  const d = decisaoAtual(i); if(!d) return "";
  return d + (document.querySelector(`[data-protesto="${i}"]:checked`) ? " " + (invertido(i) !== (sentidoPrel(i)==="DEFERIR") ? PROTESTO_CONTRA : PROTESTO) : "");
}
function pintarDecisao(i){          // Alertas espelha o que foi escrito nas Preliminares
  const d = decisaoAtual(i), mudou = d !== decisaoOriginal(i);
  document.querySelectorAll(`[data-dec-ver="${i}"]`).forEach(el=>{ el.innerHTML = decisaoHtml(d.replace(/&/g,"&amp;").replace(/</g,"&lt;")); });
  document.querySelectorAll(`[data-restaurar-dec="${i}"],[data-dec-editada="${i}"]`).forEach(el=>{ el.hidden = !mudou; });
}
function copiarTexto(txt){
  const reserva = () => { const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(_){} ta.remove(); };
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).catch(reserva);
  reserva(); return Promise.resolve();
}

  document.querySelectorAll("li.anunciar").forEach(li=>
    li.classList.toggle("feito", !!document.querySelector(`[data-prel="${li.dataset.anun}"]:checked`)));
}

/* Proposta de acordo: as linhas da faixa (total, piso, teto, mínimo, máximo) vão em destaque. */
const RE_FAIXA = /^\s*(total|piso|teto|m[íi]nimo|m[áa]ximo)|\((piso|teto)\)/i;
const nome = l => ROTULO[l] || l;
const classeOnus = o => (o==="autor"||o==="reu") ? o : "misto";
const autores = DADOS.autores || [{nome:DADOS.autor||"Reclamante", papel:"reclamante"}];
const reus = DADOS.reus || [{nome:DADOS.reu||"Reclamado", papel:"reclamada"}];
const CHAVE = "painel-preaud:" + DADOS.processo;      // anotações desta audiência, neste navegador
let roteiro = DADOS.roteiro.map(d=>({...d, perguntas:d.perguntas.map(p=>[...p])}));

/* A PRÉ-SENTENÇA NO PAINEL (ADR 0114). O cortex lê o 04_minuta_preaudi_ e grava em DADOS.presentenca as
   seções (Relatório, cada tópico, Dispositivo), com as lacunas como blocos próprios. Aqui o juiz
   acompanha o que já está em redação final, marca o ramo que a prova sustentou, escreve a avaliação
   da lacuna e a observação do tópico. Tudo fica no navegador, com as demais anotações, e sai no
   Exportar — é o que orienta a sentença pós-audiência. Sem o campo (kit, painel antigo), a aba não aparece. */
const PS = DADOS.presentenca && (DADOS.presentenca.secoes||[]).length ? DADOS.presentenca : null;
const escPS = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const textoPS = s => escPS(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const dicaPS = r => (r||"").replace(/^\(\s*(reservado:?\s*)?|\)$/gi,"") || "impressão da audiência, credibilidade, o que pesou";
function blocosPS(blocos){
  return (blocos||[]).map(b=>{
    if(b.t==="tabela") return `<div class="tabela-rolagem"><table>${b.linhas.map((l,k)=>`<tr>${l.map(c=>k?`<td>${textoPS(c)}</td>`:`<th>${textoPS(c)}</th>`).join("")}</tr>`).join("")}</table></div>`;
    if(b.t==="lacuna") return lacunaPS(b);
    return `<p>${textoPS(b.x)}</p>`;
  }).join("");
}
function lacunaPS(l){
  return `<div class="lac-ps">
    <header><b>Lacuna ${escPS(l.id)}${l.tema?` — ${escPS(l.tema)}`:""}</b>${l.natureza?`<span>${escPS(l.natureza)}</span>`:""}</header>
    ${(l.partes||[]).map((p,k)=>{
      if(p.tipo==="avaliacao") return `<div class="aval"><small>Avaliação do juiz</small>${blocosPS(p.blocos)}<textarea data-aval="${l.chave}" spellcheck="true" placeholder="${escPS(dicaPS(p.reservado))}"></textarea></div>`;
      if(p.tipo==="externa") return (p.blocos||[]).length ? `<div class="externa"><small>Análise externa</small>${blocosPS(p.blocos)}</div>` : "";
      if(p.tipo==="ramo") return `<div class="ramo" data-ramo-de="${l.chave}:${k}"><label><input type="checkbox" data-ramo="${l.chave}:${k}" title="A prova sustentou este ramo"><span>${escPS(p.rotulo)}</span></label>${blocosPS(p.blocos)}</div>`;
      return `<div class="ramo">${p.rotulo?`<small>${escPS(p.rotulo)}</small>`:""}${blocosPS(p.blocos)}</div>`;
    }).join("")}
  </div>`;
}
function secaoPS(s){
  if(s.estado==="capitulo") return `<h3 class="cap-ps">${escPS(s.titulo)}</h3>`;
  const nl = (s.blocos||[]).filter(b=>b.t==="lacuna").length;
  return `<details class="sec-ps ${s.estado}" id="ps-${s.slug}" ${s.estado==="lacuna"?"open":""}>
    <summary><b>${escPS(s.titulo)}</b><span class="tem-obs" data-tem-obs="${s.slug}" hidden>✎ com observação</span><span class="pill ${s.estado==="lacuna"?"parcial":"completa"}">${s.estado==="lacuna"?(nl>1?`${nl} lacunas`:"lacuna"):"pronto"}</span></summary>
    <div class="texto-ps">${blocosPS(s.blocos)}</div>
    <div class="obs-ps"><textarea data-obs="${s.slug}" spellcheck="true" placeholder="Observação para a sentença — o que mudar, acrescentar ou conferir neste tópico"></textarea></div>
  </details>`;
}
const valorPS = sel => { const t=document.querySelector(sel); return t ? t.value.trim() : ""; };
/* O que o juiz escreveu ou marcou numa seção: a observação, a avaliação e os ramos das lacunas dela. */
function anotadoPS(s){
  if(valorPS(`[data-obs="${s.slug}"]`)) return true;
  return (s.blocos||[]).filter(b=>b.t==="lacuna").some(l=>
    valorPS(`[data-aval="${l.chave}"]`) || document.querySelector(`[data-ramo^="${l.chave}:"]:checked`));
}
function pintarPS(){
  if(!PS) return;
  document.querySelectorAll("[data-ramo-de]").forEach(d=>
    d.classList.toggle("adotado", !!document.querySelector(`[data-ramo="${d.dataset.ramoDe}"]:checked`)));
  let n = 0;
  PS.secoes.forEach(s=>{
    const tem = s.estado!=="capitulo" && anotadoPS(s); if(tem) n++;
    document.querySelectorAll(`[data-tem-obs="${s.slug}"]`).forEach(el=>{ el.hidden = !tem; });
    document.querySelectorAll(`[data-ir-ps="${s.slug}"]`).forEach(el=>el.classList.toggle("anotado", tem));
  });
  const el = $("#contaPS"); if(el) el.textContent = n ? `${n} com observação sua` : "";
}
/* O que vai às anotações exportadas: só o que o juiz marcou ou escreveu, seção por seção. */
function anotacoesPS(){
  if(!PS) return [];
  const NL = String.fromCharCode(10), recuar = t => t.replaceAll(NL, NL + "    ");
  const linhas = [];
  PS.secoes.forEach(s=>{
    const itens = [];
    (s.blocos||[]).filter(b=>b.t==="lacuna").forEach(l=>{
      const ramos = (l.partes||[]).filter((p,k)=>p.tipo==="ramo" && document.querySelector(`[data-ramo="${l.chave}:${k}"]:checked`));
      const av = valorPS(`[data-aval="${l.chave}"]`);
      if(!ramos.length && !av) return;
      itens.push(`Lacuna ${l.id}${l.tema?` — ${l.tema}`:""}`);
      ramos.forEach(p=>itens.push("    Ramo adotado: " + p.rotulo));
      if(av) itens.push("    Avaliação do juiz: " + recuar(av));
    });
    const ob = valorPS(`[data-obs="${s.slug}"]`);
    if(ob) itens.push("Observação: " + recuar(ob));
    if(itens.length) linhas.push(`### ${s.titulo}`, ...itens, "");
  });
  if(!linhas.length) return [];
  return ["## Pré-sentença — observações do juiz",
          `Feitas no painel sobre ${PS.arquivo || "a pré-sentença"}: o ramo adotado em cada lacuna, a avaliação do juiz e a observação de cada tópico. Valem para a sentença.`,
          "", ...linhas];
}

/* PARTE x TESTEMUNHA. O campo `tipo` manda; sem ele, o nome decide. A parte
   (reclamante, preposto) ganha a marca "dispensado"; a testemunha ganha o campo
   do nome. Depoimento dispensado nao leva as perguntas para o documento; vaga de
   testemunha sem nome nao vai de jeito nenhum. */
const ehTestemunha = d => (d.tipo||"").toLowerCase()==="testemunha" || /testemunh/i.test(d.depoente||"");
/* As vagas seguem o rito (ADR 0175, item A2): ate duas testemunhas por parte no sumarissimo (art. 852-H,
   § 2º, da CLT) e tres no ordinario (art. 821 da CLT). Rito que o cortex nao achou: tres, com o aviso. */
const RITO = String(DADOS.rito||"").toLowerCase();
const SUMARISSIMO = RITO==="sumarissimo";
const TESTEMUNHAS_POR_LADO = SUMARISSIMO ? 2 : 3;
function avisoRito(){
  const fonte = DADOS.rito_fonte ? ` (${DADOS.rito_fonte})` : "";
  let txt = SUMARISSIMO
    ? `<b>Rito sumaríssimo</b>${fonte}: até duas testemunhas por parte (art. 852-H, § 2º, da CLT).`
    : RITO==="ordinario"
      ? `<b>Rito ordinário</b>${fonte}: até três testemunhas por parte (art. 821 da CLT).`
      : `<b>Rito não identificado</b>: o painel abre três vagas de cada lado, como no ordinário (art. 821 da CLT). No sumaríssimo, são duas por parte (art. 852-H, § 2º).`;
  if((DADOS.reus||[]).length>1) txt += " Com mais de uma reclamada, quantas testemunhas cada ré pode indicar é decisão do juízo.";
  return `<p class="explica aviso-rito">${txt}</p>`;
}
const ORDINAL = ["1ª","2ª","3ª","4ª","5ª"];
const LADO_ROT = {autor:"reclamante", reu:"reclamado"};
const BASE_PADRAO = [["Base","Que função exercia? Em que período e local trabalhou com o reclamante?"]];

/* As perguntas de uma vaga de testemunha. Havendo no roteiro uma testemunha daquele lado, a vaga recebe TODAS
   as perguntas dela (o juiz, 12/11/2026: "as perguntas sugeridas para as testemunhas aparecem apenas na
   primeira testemunha, mas não são estendidas para as testemunhas seguintes"): as de tema Base primeiro, na
   posicao que ja' tinham (as marcas sao guardadas por indice), e depois as dos temas. Sem testemunha no roteiro
   do lado, como antes: as de tema Base do lado ou a pergunta-base generica. */
function perguntasBase(lado){
  const testemunha = roteiro.find(d=>d.lado===lado && ehTestemunha(d) && !d.auto);
  const base = testemunha || roteiro.find(d=>d.lado===lado);
  const dela = base ? base.perguntas.filter(q=>q[0]==="Base") : [];
  const inicio = (dela.length ? dela : BASE_PADRAO).map(q=>[...q]);
  const temas = testemunha ? testemunha.perguntas.filter(q=>q[0]!=="Base").map(q=>[...q]) : [];
  return inicio.concat(temas);
}
/* O painel fica SEMPRE pronto para as testemunhas que o rito admite de cada lado. As vagas entram
   depois do que a skill trouxe e ANTES dos depoentes acrescentados a mao, para que
   os indices (que guardam as anotacoes) nao mudem de uma abertura para outra. */
function completarTestemunhas(){
  ["autor","reu"].forEach(lado=>{
    const tem = roteiro.filter(d=>d.lado===lado && ehTestemunha(d)).length;
    for(let k=tem; k<TESTEMUNHAS_POR_LADO; k++){
      roteiro.push({depoente:`${ORDINAL[k]} testemunha do ${LADO_ROT[lado]}`, lado,
                    tipo:"testemunha", auto:true, perguntas:perguntasBase(lado)});
    }
  });
}
function campoNome(i){ const t=document.querySelector(`[data-nomedep="${i}"]`); return t ? t.value.trim() : ""; }
function campoLivre(i){ const t=document.querySelector(`[data-livre="${i}"]`); return t ? t.value.trim() : ""; }
/* As perguntas que receberam marca ou resposta — o que de fato foi perguntado. */
function perguntasEscritas(d,i){
  return d.perguntas.map((q,j)=>{
    const cb=document.querySelector(`[data-perg="${i}-${j}"]`), nt=document.querySelector(`[data-nota="${i}-${j}"]`);
    const marcada = !!(cb && cb.checked), resposta = nt ? nt.value.trim() : "";
    return (marcada || resposta) ? {q, j, marcada, resposta} : null;
  }).filter(Boolean);
}
function dispensado(i){ const c=document.querySelector(`[data-dispensa="${i}"]`); return !!(c && c.checked); }
/* Entra no documento exportado? Testemunha precisa de nome; parte, de nao estar dispensada. */
function entraNoDocumento(i){
  const d = roteiro[i]; if(!d) return true;
  if(!ehTestemunha(d)) return !dispensado(i);
  // vaga de testemunha: o nome basta; sem ele, basta ter sido escrito alguma coisa
  // (observação ou resposta) — nada digitado pode sumir do documento
  return !!campoNome(i) || !!campoLivre(i) || perguntasEscritas(d,i).length > 0;
}

$("#hProcesso").textContent = DADOS.processo;
$("#hAudiencia").textContent = DADOS.audiencia;
$("#hGerado").textContent = DADOS.gerado_em ? "Gerado em " + DADOS.gerado_em : "";
$("#rAutor").textContent = autores.length>1 ? "Reclamantes" : "Reclamante";
$("#rReu").textContent = reus.length>1 ? "Reclamadas" : "Reclamado";
/* Link de peça: abre o PDF dos autos já na página. Serve aos dois blocos da aba
   Autos — as essenciais (o cortex acha no índice) e as citadas (a sessão listou). */
const pecaHtml = ([id,n,arq,pg]) =>
  `<li><a href="${arq}#page=${pg}" target="_blank" rel="noopener"><code>${id}</code> ${n}</a><small>${arq}, p. ${pg}</small></li>`;
/* Na página publicada o navegador não mostra PDF: o link de PDF abre o visor-pdf.html, na mesma tela, já na folha. */
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a[href]"); if(!a) return;
  const m = a.getAttribute("href").match(/^([\w.-]+\.pdf)(?:#page=(\d+))?$/i); if(!m) return;
  e.preventDefault(); location.href = "visor-pdf.html#" + m[1] + "/" + (m[2] || 1);
});

/* ADR 0112: o nome real da parte vem do Cortex na hora de abrir e só fica na tela, ao lado do
   anonimizado — não entra no DADOS, no arquivo, na exportação nem na impressão. */
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const escNome = esc;
const partesHtml = (lista, reais=[], reps=[]) => lista.map((p,i)=>{
  const r = (reais && reais[i]) ? String(reais[i]) : "";
  const repObj = (reps && reps[i]) || {};
  const escr = (p && p.escritorio) || repObj.escritorio || "";
  const adv = (p && p.advogado) || repObj.advogado || "";
  const repTxt = (p && p.representacao) || repObj.representacao || "";
  let sub = "";
  if(escr && adv) sub = `${escr} · ${adv}`;
  else if(escr) sub = escr;
  else if(adv) sub = adv;
  else if(repTxt) sub = repTxt;
  const nomeHtml = `${esc(p.nome)}${r?` <span class="nome-real" title="Nome real (só na tela; não vai à exportação)">· ${esc(r)}</span>`:""}${p.papel?` <em>(${esc(p.papel)})</em>`:""}`;
  const repHtml = sub ? `<span class="rep" title="Representação processual">${esc(sub)}</span>` : "";
  return `<div class="parte-item">${nomeHtml}${repHtml}</div>`;
}).join("");
/* Mais de três partes de um lado: mostra as duas primeiras e um "ver mais N" que abre a lista. */
const LIMITE_PARTES = 3;
function encaixarPartes(sel, html, qtd){
  const el = $(sel); el.innerHTML = html;
  el.classList.remove("recolhida","aberta");
  if(qtd <= LIMITE_PARTES) return;
  const aberta = el.dataset.aberta === "1";
  el.classList.add(aberta ? "aberta" : "recolhida");
  const b = document.createElement("button");
  b.type = "button"; b.className = "mais";
  b.textContent = aberta ? "ver menos" : `ver mais ${qtd-2}`;
  b.onclick = () => { el.dataset.aberta = aberta ? "0" : "1"; encaixarPartes(sel, html, qtd); };
  el.appendChild(b);
}
encaixarPartes("#hAutor", partesHtml(autores), autores.length);
encaixarPartes("#hReu", partesHtml(reus), reus.length);
function mostrarNomesReais(){
  const pegar = url => fetch(url).then(r => r.json()).then(j => j.ok ? j : Promise.reject());
  const rota = `/partes?processo=${encodeURIComponent(DADOS.processo)}&tipo=${DADOS.tipo || "preaudi"}`;
  const [primeiro, outros] = enderecosDoCortex(rota);
  pegar(primeiro).catch(() => Promise.any(outros.map(pegar))).then(j => {
    const ra = j.representacoes_autores || [];
    const rr = j.representacoes_reus || [];
    if((j.autores || []).some(Boolean) || ra.some(Boolean)) encaixarPartes("#hAutor", partesHtml(autores, j.autores, ra), autores.length);
    if((j.reus || []).some(Boolean) || rr.some(Boolean)) encaixarPartes("#hReu", partesHtml(reus, j.reus, rr), reus.length);
  }).catch(() => {});   // Cortex fechado: fica o anonimizado
}
/* ADR 0247: o nome real que a montagem já gravou no painel aparece de saída; o receptor só complementa. */
(function(){
  const j = DADOS.nomes_reais_cortex; if(!j) return;
  const ra = j.representacoes_autores || [], rr = j.representacoes_reus || [];
  if((j.autores || []).some(Boolean) || ra.some(Boolean)) encaixarPartes("#hAutor", partesHtml(autores, j.autores, ra), autores.length);
  if((j.reus || []).some(Boolean) || rr.some(Boolean)) encaixarPartes("#hReu", partesHtml(reus, j.reus, rr), reus.length);
})();
mostrarNomesReais();

function totalPerg(){ return roteiro.reduce((n,d)=>n+d.perguntas.length,0); }

function defesasHtml(c){
  const lista = c.defesas || [{parte:"", texto:c.defesa||""}];
  return lista.map(d=>`<div class="defesa"><small>Defesa${d.parte?` — ${d.parte}`:""}</small>${d.texto}</div>`).join("");
}
function onusHtml(c){
  const cls = classeOnus(c.onus);
  const rot = cls==="misto" ? nome(c.onus) : `Ônus: ${nome(c.onus)}`;
  const det = c.onus_detalhe ? ` · ${c.onus_detalhe}` : "";
  return `<div class="onus ${cls==="misto"?"repartido":""}">

}

/* A cabeca do depoimento: a parte tem a dispensa; a testemunha, o nome. */
function cabecaDep(d,i){
  if(ehTestemunha(d)) return `<div class="cabeca-dep">

  </div>`;

}

/* Abertura (ADR 0141): perguntas fixas que a IA responde com a peça; o cortex junta, em `abertura_cortex`,
   o que o índice dos autos mostra (sentença, acórdão, atas, laudo, sigilo, rol), para o juiz conferir. */
const AB_SIT = {ok:"em ordem", atencao:"atenção", providencia:"providência"};
const abEsc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const abNorm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const abPeca = p => (Array.isArray(p) && p.length>=4)
  ? `<a href="${p[2]}#page=${p[3]}" target="_blank" rel="noopener"><code>${abEsc(p[0])}</code> ${abEsc(p[1])}</a>`
  : (typeof p==="string" && p ? `<code>${abEsc(p)}</code>` : "");
function aberturaHtml(){
  const itens = DADOS.abertura || [], ind = DADOS.abertura_cortex || [];
  if(!itens.length && !ind.length) return "";
  return `<h3 style="margin-top:0">Abertura — o que saber antes de começar</h3>
  ${itens.length?`<div class="abertura">${itens.map(a=>{ const k = abNorm(a.situacao); return `<div class="ab-item ${AB_SIT[k]?k:""}">
    <div class="ab-tema">${abEsc(a.tema)}${AB_SIT[k]?`<span class="ab-sit ${k}">${AB_SIT[k]}</span>`:""}</div>
    <div class="ab-resp">${a.resposta||"<small>sem resposta</small>"}${(a.pecas||[]).length?`<div class="ab-pecas">${a.pecas.map(abPeca).join("")}</div>`:""}</div>
  </div>`; }).join("")}</div>`:`<p class="rodape">A análise não trouxe a abertura.</p>`}
  ${ind.length?`<div class="ab-indice"><small>O índice dos autos mostra — conferência do cortex</small>${ind.map(([r,ps])=>`<div><b>${abEsc(r)}:</b> ${(ps||[]).map(abPeca).join(" ")}</div>`).join("")}</div>`:""}`;
}

/* PARADA de integridade (ADR 0164): falta peça estruturante e não há pré-sentença; o painel diz por quê e o
   que fazer na sala, com as peças. */

  </div>`;
}

    <thead><tr><th>#</th><th>Tema</th><th>Prova</th><th>Estado</th><th>Ônus</th><th>Providência</th></tr></thead>
    <tbody>${DADOS.provas.map(([t,p,s,o,prov],i)=>`<tr>
      <td class="num">${i+1}</td><td>${t}</td><td>${p}</td>
      <td><span class="pill ${s}">${ESTADO[s]||s}</span></td>
      <td>${o in ROTULO?`<span class="parte ${classeOnus(o)}">${nome(o)}</span>`:o}</td>
      <td>${prov}</td></tr>`).join("")}</tbody>
  </table></div>
  <div class="legenda"><span>✅ completa — prova já produzida</span><span>⚠️ parcial — incompleta</span><span>❌ pendente — não produzida</span><span>➖ dispensada — ponto incontroverso</span></div>
</section>

<section id="s-roteiro" ${abaAtual!=="roteiro"?"hidden":""}>
  ${avisoRito()}
  <div class="depoentes" role="tablist">${roteiro.map((d,i)=>
    `<button class="depoente ${d.lado}" role="tab" data-dep="${i}" aria-selected="${i===0}">${d.depoente}</button>`).join("")}

  <div class="progresso" id="progresso"></div>
  ${roteiro.map((d,i)=>`<div class="lista-perg" data-lista="${i}" data-nome="${d.depoente}" ${i?"hidden":""}>

    ${d.perguntas.map(([tema,q],j)=>`
    <div class="pergunta">
      <label><input type="checkbox" data-perg="${i}-${j}"><span class="txt"><span class="tema">${tema}</span>${q}</span></label>

    </div>`).join("")}
    <div class="livre"><textarea data-livre="${i}" placeholder="Observações deste depoimento — só este campo preenchido já vai para o documento"></textarea></div>

</section>

${PS?`<section id="s-presentenca" ${abaAtual!=="presentenca"?"hidden":""}>
  <p class="explica">A pré-sentença como está na pasta (<code>${escPS(PS.arquivo||"04_minuta_preaudi")}</code>): ${PS.prontos||0} tópico(s) em redação final e ${PS.lacunas||0} lacuna(s) que a audiência fecha. Marque o ramo que a prova sustentou, escreva a avaliação da lacuna e a observação do tópico: tudo sai em <b>Exportar anotações</b> e orienta a sentença.</p>
  <div class="acoes-ps">
    <button type="button" data-ps-abrir="1">Abrir tudo</button><button type="button" data-ps-abrir="0">Fechar tudo</button>
    <label><input type="checkbox" id="psSoLacunas"> só as lacunas</label>

    <span id="contaPS"></span>
  </div>
  <nav class="indice-ps">${PS.secoes.filter(s=>s.estado!=="capitulo").map(s=>`<button type="button" class="${s.estado}" data-ir-ps="${s.slug}">${escPS(s.titulo)}</button>`).join("")}</nav>
  ${PS.secoes.map(secaoPS).join("")}

/* Esmaece (e tira da impressao) o depoimento que nao vai para o documento. */
function pintarFora(){
  document.querySelectorAll(".lista-perg").forEach(l=>{
    l.classList.toggle("fora", !entraNoDocumento(+l.dataset.lista));
  });
}
/* A aba da testemunha passa a mostrar o nome digitado; vaga em branco fica tracejada. */
function pintarAbas(){
  document.querySelectorAll(".depoente[data-dep]").forEach(b=>{
    const i = +b.dataset.dep, d = roteiro[i];
    if(!d) return;
    const n = ehTestemunha(d) ? campoNome(i) : "";
    b.textContent = n || d.depoente;
    b.title = n ? d.depoente : "";
    b.classList.toggle("vazio", ehTestemunha(d) && !n);
  });
}

/* anotações persistem neste navegador, por processo (localStorage); Exportar grava na pasta do processo via Cortex, ou baixa */
function estado(){
  // as vagas automaticas nao sao "extras": o painel as recria igual a cada abertura
  const e = {marcas:{}, notas:{}, livres:{}, docs:{}, prels:{}, protestos:{}, invertidos:{}, decisoes:{}, nomes:{}, dispensas:{},
             obs:{}, avals:{}, ramos:{},
             extras:roteiro.filter(d=>!d.auto).slice(DADOS.roteiro.length)};
  document.querySelectorAll("[data-perg]").forEach(c=>{ if(c.checked) e.marcas[c.dataset.perg]=1; });
  document.querySelectorAll("[data-nota]").forEach(t=>{ if(t.value.trim()) e.notas[t.dataset.nota]=t.value; });
  document.querySelectorAll("[data-livre]").forEach(t=>{ if(t.value.trim()) e.livres[t.dataset.livre]=t.value; });
  document.querySelectorAll("[data-doc]").forEach(c=>{ if(c.checked) e.docs[c.dataset.doc]=1; });
  document.querySelectorAll("[data-prel]").forEach(c=>{ if(c.checked) e.prels[c.dataset.prel]=1; });
  document.querySelectorAll("[data-protesto]").forEach(c=>{ if(c.checked) e.protestos[c.dataset.protesto]=1; });
  document.querySelectorAll("[data-inverter]").forEach(c=>{ if(c.checked) e.invertidos[c.dataset.inverter]=1; });
  document.querySelectorAll("[data-dec-edit]").forEach(t=>{ const i=t.dataset.decEdit; if(t.value.trim() && t.value.trim()!==decisaoOriginal(i)) e.decisoes[i]=t.value; });
  document.querySelectorAll("[data-nomedep]").forEach(t=>{ if(t.value.trim()) e.nomes[t.dataset.nomedep]=t.value.trim(); });
  document.querySelectorAll("[data-dispensa]").forEach(c=>{ if(c.checked) e.dispensas[c.dataset.dispensa]=1; });
  document.querySelectorAll("[data-obs]").forEach(t=>{ if(t.value.trim()) e.obs[t.dataset.obs]=t.value; });
  document.querySelectorAll("[data-aval]").forEach(t=>{ if(t.value.trim()) e.avals[t.dataset.aval]=t.value; });
  document.querySelectorAll("[data-ramo]").forEach(c=>{ if(c.checked) e.ramos[c.dataset.ramo]=1; });
  const ta = document.querySelector("[data-ata]"); if(ta && ta.value.trim()) e.ata = ta.value;
  return e;
}
function salvar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(estado())); }catch(_){} }
function restaurar(){
  let e; try{ e = JSON.parse(localStorage.getItem(CHAVE)||"null"); }catch(_){ e=null; }
  if(!e) return;
  document.querySelectorAll("[data-perg]").forEach(c=>{ c.checked=!!e.marcas[c.dataset.perg]; c.closest(".pergunta").classList.toggle("feita",c.checked); });
  document.querySelectorAll("[data-nota]").forEach(t=>{ t.value=e.notas[t.dataset.nota]||""; ajustaAltura(t); });
  document.querySelectorAll("[data-livre]").forEach(t=>{ t.value=e.livres[t.dataset.livre]||""; });
  document.querySelectorAll("[data-doc]").forEach(c=>{ c.checked=!!e.docs[c.dataset.doc]; });
  document.querySelectorAll("[data-prel]").forEach(c=>{ c.checked=!!e.prels[c.dataset.prel]; });
  document.querySelectorAll("[data-protesto]").forEach(c=>{ c.checked=!!(e.protestos||{})[c.dataset.protesto]; });
  document.querySelectorAll("[data-inverter]").forEach(c=>{ c.checked=!!(e.invertidos||{})[c.dataset.inverter]; });
  document.querySelectorAll("[data-dec-edit]").forEach(t=>{ const i=t.dataset.decEdit; t.value=(e.decisoes||{})[i]||decisaoOriginal(i); pintarDecisao(i); });
  pintarRotulos();
  pintarAnunciados();
  document.querySelectorAll("[data-nomedep]").forEach(t=>{ t.value=(e.nomes||{})[t.dataset.nomedep]||""; });
  document.querySelectorAll("[data-dispensa]").forEach(c=>{ c.checked=!!(e.dispensas||{})[c.dataset.dispensa]; });
  document.querySelectorAll("[data-obs]").forEach(t=>{ t.value=(e.obs||{})[t.dataset.obs]||""; });
  document.querySelectorAll("[data-aval]").forEach(t=>{ t.value=(e.avals||{})[t.dataset.aval]||""; });
  document.querySelectorAll("[data-ramo]").forEach(c=>{ c.checked=!!(e.ramos||{})[c.dataset.ramo]; });
  pintarPS();
  const ta = document.querySelector("[data-ata]"); if(ta){ ta.value = e.ata || ""; medirAta(); }
}
/* A ata colada fica guardada com o resto (localStorage); a aba ganha o "✓" quando ha' texto. */
function ataGuardada(){
  try{ const e = JSON.parse(localStorage.getItem(CHAVE)||"null"); return !!(e && e.ata && e.ata.trim()); }catch(_){ return false; }
}
function medirAta(){
  const ta = document.querySelector("[data-ata]"), el = $("#tamAta"); if(!ta || !el) return;
  const n = ta.value.trim().length;
  el.textContent = n ? `${n.toLocaleString("pt-BR")} caracteres` : "";
}
function pintarAbaAta(){
  const b = document.querySelector('.aba[data-aba="ata"]'); if(!b) return;
  const ta = document.querySelector("[data-ata]"), tem = !!(ta && ta.value.trim());
  let n = b.querySelector(".n");
  if(tem && !n){ n = document.createElement("span"); n.className = "n ok"; n.textContent = "✓"; b.appendChild(n); }
  if(!tem && n) n.remove();
}
(function prepararRoteiro(){
  completarTestemunhas();          // as vagas, sempre nas mesmas posicoes
  try{ const e = JSON.parse(localStorage.getItem(CHAVE)||"null"); if(e&&e.extras) roteiro = roteiro.concat(e.extras); }catch(_){}
})();

function textoAnotacoes(){
  const NL = String.fromCharCode(10);
  const linhas = [`Anotações da audiência — ${DADOS.processo} — ${DADOS.audiencia}`, `Exportado em ${new Date().toLocaleString("pt-BR")}`];
  if(textoAta()) linhas.push("Ata da audiência colada no painel: gravada à parte, em 04_ata_audiencia (ADR 0093).");
  linhas.push("");
  roteiro.forEach((d,i)=>{
    const testemunha = ehTestemunha(d);
    const nome = campoNome(i);
    const recuar = t => t.replaceAll(NL, NL + "       ");
    const anotacaoLivre = () => {
      const lv = campoLivre(i);
      if(lv) linhas.push("    Anotações: " + recuar(lv));
    };
    if(testemunha && !nome){
      // Vaga sem nome. Escrita em branco, não foi usada: fica fora do documento.
      // Mas o que o magistrado anotou ali vale por si — "não compareceu",
      // "contradita acolhida", "dispensada pelas partes" — e não pode sumir.
      const escritas = perguntasEscritas(d,i);
      if(!campoLivre(i) && !escritas.length) return;
      linhas.push(`## ${d.depoente} (sem nome anotado)`);
      escritas.forEach(({q,marcada,resposta})=>{
        linhas.push(`${marcada?"[x]":"[ ]"} (${q[0]}) ${q[1]}`);
        if(resposta) linhas.push("    R: " + recuar(resposta));
      });
      anotacaoLivre();
      linhas.push("");
      return;
    }
    linhas.push(`## ${testemunha ? `${nome} — ${d.depoente}` : d.depoente}`);
    // parte com o depoimento dispensado: fica o registro, sem as perguntas
    if(!testemunha && dispensado(i)){
      linhas.push("Depoimento dispensado.");
      anotacaoLivre();
      linhas.push("");
      return;
    }
    d.perguntas.forEach(([tema,q],j)=>{
      const cb=document.querySelector(`[data-perg="${i}-${j}"]`), nt=document.querySelector(`[data-nota="${i}-${j}"]`);
      linhas.push(`${cb&&cb.checked?"[x]":"[ ]"} (${tema}) ${q}`);
      if(nt&&nt.value.trim()) linhas.push("    R: " + recuar(nt.value.trim()));
    });
    anotacaoLivre();
    linhas.push("");
  });
  // requerimentos anunciados na abertura (só os marcados), com a decisão ditada e o protesto
  const anunciados = DADOS.preliminares.map(([p],i)=>[p,i]).filter(([,i])=>(document.querySelector(`[data-prel="${i}"]:checked`) || invertido(i)) && partesPrel(DADOS.preliminares[i][1]));
  if(anunciados.length){
    linhas.push("## Requerimentos decididos na abertura");
    anunciados.forEach(([p,i])=>{ linhas.push("[x] " + rotuloPrel(i));
      if(invertido(i)) linhas.push("    ATENÇÃO: decidido em audiência AO CONTRÁRIO do que a pré-sentença previa (" + p + ").");
      linhas.push("    Decisão: " + textoDecisao(i)); });
    linhas.push("");
  }
  // pré-sentença: ramo adotado, avaliação do juiz e observação por tópico (ADR 0114)
  linhas.push(...anotacoesPS());
  return linhas.join(NL);
}
function baixarAnotacoes(texto){
  const blob = new Blob([texto], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `04_anotacoes_audiencia-${DADOS.processo}.md`; a.click(); URL.revokeObjectURL(a.href);
}
function avisarExport(msg, ok){
  const el = $("#stExportar"); if(!el) return;
  el.hidden = false;
  el.textContent = msg;
  el.className = "status-exp " + (ok ? "ok" : "erro");
}
/* O receptor do Cortex sobe na 8765 ou na seguinte livre (até a 8774), e o painel pode ter sido
   montado antes de o Cortex reabrir noutra porta: o endereço gravado em DADOS é só o primeiro
   palpite; sem resposta dele, o painel procura nas outras portas antes de baixar (ADR 0107). */
function enderecosDoCortex(rota){
  const base = (DADOS.cortex_anotacoes || "http://127.0.0.1:8765/anotacoes").replace(/\/anotacoes\/?$/, "");
  const outros = [];
  for(let p = 8765; p < 8775; p++){ const u = "http://127.0.0.1:" + p; if(u !== base) outros.push(u + rota); }
  return [base + rota, outros];
}
function enviarAoCortex(rota, corpo){
  const postar = url => fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(corpo)
  }).then(r => r.json().then(j => ({r, j})).catch(() => ({r, j:{}})))
    .then(({r, j}) => {
      if(r.ok && j.ok) return j;
      throw new Error(j.erro || j.mensagem || ("HTTP " + r.status));
    });
  const [primeiro, outros] = enderecosDoCortex(rota);
  return postar(primeiro).catch(() => Promise.any(outros.map(postar)));
}
function exportar(){
  const texto = textoAnotacoes();
  avisarExport("Gravando na pasta do processo…", true);
  enviarAoCortex("/anotacoes", {processo: DADOS.processo, texto})
    .then(j => {
      const nome = j.arquivo || "04_anotacoes_audiencia";
      avisarExport("Gravado: " + nome, true);
      // ADR 0093: texto na aba Ata vai junto — um clique basta, seja qual for o botão
      if(textoAta()) gravarAta((ok, arq) => avisarExport(ok ? `Gravado: ${nome} e ${arq}` : `Gravado: ${nome}; a ata foi baixada`, ok));
    }, () => {
      baixarAnotacoes(texto);
      if(textoAta()) baixarAta(textoAta());
      avisarExport("Cortex fechado — baixei o arquivo; leve-o à pasta do processo", false);
    });
}

/* A ata colada vai para a pasta do processo pelo mesmo receptor das anotacoes, na rota /ata
   (ADR 0091): 04_ata_audiencia_<tag>.md. Sem o Cortex, baixa o arquivo. */
function textoAta(){
  const NL = String.fromCharCode(10);
  const ta = document.querySelector("[data-ata]"); const corpo = ta ? ta.value.trim() : "";
  if(!corpo) return "";
  return [`# Ata da audiência — ${DADOS.processo} — ${DADOS.audiencia}`,
          `Colada no painel em ${new Date().toLocaleString("pt-BR")}`, "", corpo, ""].join(NL);
}
function baixarAta(texto){
  const blob = new Blob([texto], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `04_ata_audiencia-${DADOS.processo}.md`; a.click(); URL.revokeObjectURL(a.href);
}
function avisarAta(msg, ok){
  const el = $("#stAta"); if(!el) return;
  el.hidden = false;
  el.textContent = msg;
  el.className = "status-exp " + (ok ? "ok" : "erro");
}
function gravarAta(depois){
  const texto = textoAta();
  if(!texto){ avisarAta("Cole a ata antes de gravar.", false); return; }
  avisarAta("Gravando na pasta do processo…", true);
  enviarAoCortex("/ata", {processo: DADOS.processo, texto})
    .then(j => {
      const arq = j.arquivo || "04_ata_audiencia";
      avisarAta("Gravado: " + arq + " — a sentença já pode ser pedida", true);
      if(depois) depois(true, arq);
    }, () => {
      baixarAta(texto);
      avisarAta("Cortex fechado — baixei o arquivo; leve-o à pasta do processo", false);
      if(depois) depois(false, "");
    });
}

function ajustaAltura(t){ t.style.height="auto"; t.style.height=t.scrollHeight+"px"; }
function atualizaProgresso(){
  const lista=document.querySelector(".lista-perg:not([hidden])"); if(!lista) return;
  const cbs=[...lista.querySelectorAll("[data-perg]")];   // so' as perguntas: a caixa da dispensa nao conta
  const feitas=cbs.filter(c=>c.checked).length;
  const geral=[...document.querySelectorAll("[data-perg]")].filter(c=>c.checked).length;
  $("#progresso").textContent=`${feitas} de ${cbs.length} neste depoimento · ${geral} de ${totalPerg()} no total`;
}

/* atalho "Ir ao resumo do caso" (pedido do juiz, 13/10/2026): a abertura e a ficha empurraram o resumo para baixo;
   o atalho no topo da aba Caso rola até ele, descontando o cabeçalho fixo, e o realça por dois segundos */
function irAte(id){
  const el=document.getElementById(id); if(!el) return;
  window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - (document.querySelector(".topo")?.offsetHeight||0) - 10, behavior:"smooth"});
  el.classList.add("alvo"); setTimeout(()=>el.classList.remove("alvo"),2000);
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-ir-id]"); if(!a) return;
  e.preventDefault(); irAte(a.dataset.irId);
});

/* abas principais */
$("#abas").addEventListener("click",e=>{
  const b=e.target.closest(".aba"); if(!b) return;
  document.querySelectorAll(".aba").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll("main>section").forEach(s=>s.hidden = s.id!=="s-"+b.dataset.aba);
  window.scrollTo({top:0});
});
/* remissão da aba Caso às Preliminares: abre a aba Verificar e rola até o requerimento */
$("#conteudo").addEventListener("click",e=>{
  const ab=e.target.closest("[data-abrir-req]");
  if(ab){ const li=ab.closest("li.anunciar"), c=li.querySelector(".corpo"); c.hidden=!c.hidden; li.classList.toggle("aberto",!c.hidden); return; }
  const rs=e.target.closest("[data-restaurar-dec]");
  if(rs){ const i=rs.dataset.restaurarDec, ta=document.querySelector(`[data-dec-edit="${i}"]`);
    if(ta){ ta.value=decisaoOriginal(i); pintarDecisao(i); salvar(); } return; }
  const cp=e.target.closest("[data-copiar-dec]");
  if(cp){ const av=cp.parentElement.querySelector(".copiado");
    copiarTexto(textoDecisao(cp.dataset.copiarDec)).then(()=>{ if(av){ av.hidden=false; setTimeout(()=>av.hidden=true,2000); } }); return; }
  const ia=e.target.closest("[data-ir-aba]");
  if(ia){ e.preventDefault(); document.querySelector(`.aba[data-aba="${ia.dataset.irAba}"]`)?.click(); return; }
  const pa=e.target.closest("[data-ps-abrir]");
  if(pa){ document.querySelectorAll("details.sec-ps").forEach(d=>{ d.open = pa.dataset.psAbrir==="1"; }); return; }
  const ip=e.target.closest("[data-ir-ps]");
  if(ip){ const d=document.getElementById("ps-"+ip.dataset.irPs); if(!d) return;
    d.open = true;                       // o cabeçalho é fixo: rola até logo abaixo dele
    window.scrollTo({top: d.getBoundingClientRect().top + window.scrollY - document.querySelector(".topo").offsetHeight - 10});
    d.classList.add("alvo"); setTimeout(()=>d.classList.remove("alvo"),2000); return; }
  const b=e.target.closest("[data-ir-prel]"); if(!b) return;
  document.querySelector('.aba[data-aba="verificar"]')?.click();
  const li=document.getElementById("prel-"+b.dataset.irPrel); if(!li) return;
  li.scrollIntoView({block:"center"});
  li.classList.add("alvo"); setTimeout(()=>li.classList.remove("alvo"),2500);
});
/* depoentes, inclusive os acrescentados na hora */
document.addEventListener("click",e=>{
  if(e.target.closest("#btAta")){ gravarAta(); return; }
  const mais=e.target.closest("#btMais");
  if(mais){
    const n=prompt("Nome do depoente (ex.: 3ª testemunha do reclamante):"); if(!n) return;
    const lado=confirm("É depoente do lado do reclamante?\nOK = reclamante · Cancelar = reclamado") ? "autor" : "reu";
    const jaSao = roteiro.filter(d=>d.lado===lado && ehTestemunha(d)).length;
    if(/testemunh/i.test(n) && jaSao>=TESTEMUNHAS_POR_LADO &&       // ADR 0175 (A2): além do que o rito admite
       !confirm(`O rito admite até ${TESTEMUNHAS_POR_LADO} testemunhas por parte, e este lado já tem ${jaSao} vaga(s). Acrescentar assim mesmo?`)) return;
    const base = roteiro.find(d=>d.lado===lado && d.perguntas.some(p=>p[0]==="Base"));
    const perguntas = base ? base.perguntas.filter(p=>p[0]==="Base").map(p=>[...p]) : [["Base","Que função exercia? Em que período e local trabalhou com o reclamante?"]];
    roteiro.push({depoente:n, lado, perguntas});
    salvar(); montar();
    document.querySelector(`.depoente[data-dep="${roteiro.length-1}"]`)?.click();
    return;
  }
  const b=e.target.closest(".depoente"); if(!b||b.classList.contains("mais")) return;
  document.querySelectorAll(".depoente").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll(".lista-perg").forEach(l=>l.hidden = l.dataset.lista!==b.dataset.dep);
  atualizaProgresso();
});
/* marcação de perguntas, progresso e persistência */
document.addEventListener("change",e=>{
  for(const at of ["prel","protesto","inverter"]){          // a mesma caixa aparece em Alertas (Caso) e nas Preliminares
    if(e.target.dataset && e.target.dataset[at]!==undefined)
      document.querySelectorAll(`[data-${at}="${e.target.dataset[at]}"]`).forEach(c=>{ c.checked=e.target.checked; });
  }
  pintarAnunciados();
  if(e.target.dataset && e.target.dataset.inverter!==undefined){ aoInverter(e.target.dataset.inverter); pintarRotulos(); }
  if(e.target.matches("[data-perg]")){
    e.target.closest(".pergunta").classList.toggle("feita",e.target.checked);
    atualizaProgresso();
  }
  if(e.target.matches("[data-dispensa]") || e.target.matches("[data-perg]")) pintarFora();
  if(e.target.matches("[data-ramo]")) pintarPS();
  if(e.target.id==="psSoLacunas"){ $("#s-presentenca").classList.toggle("so-lacunas", e.target.checked); return; }
  salvar();
});
document.addEventListener("input",e=>{
  if(e.target.tagName==="TEXTAREA"){
    if(e.target.dataset.nota!==undefined) ajustaAltura(e.target);
    if(e.target.dataset.decEdit!==undefined){ pintarDecisao(e.target.dataset.decEdit); salvar(); return; }
    if(e.target.dataset.ata!==undefined){ medirAta(); pintarAbaAta(); salvar(); return; }
    if(e.target.dataset.obs!==undefined || e.target.dataset.aval!==undefined){ pintarPS(); salvar(); return; }
    pintarFora();                       // observação escrita tira a vaga do esmaecido
    salvar();
  }
  if(e.target.matches("[data-nomedep]")){ pintarFora(); pintarAbas(); salvar(); }
});
$("#btFonte").addEventListener("click",()=>{
  const g=document.body.classList.toggle("grande");
  $("#btFonte").textContent=g?"A−":"A+";
});
$("#btExportar").addEventListener("click",exportar);
montar();
</script>
